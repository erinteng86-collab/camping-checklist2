<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>露營裝備檢核與分工</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: #f7f5f0;
      color: #2d3748;
    }
    .custom-card {
      background-color: #ffffff;
      border: 1px solid #e9e5dc;
      border-radius: 1rem;
      transition: all 0.2s ease;
    }
    .custom-card:hover {
      border-color: #1e3a24;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(30, 58, 36, 0.06);
    }
    .nav-btn-active {
      background-color: #162d1c !important;
      color: #ffffff !important;
    }
    .assignee-pill.active {
      background-color: #1e3a24;
      color: #ffffff;
      font-weight: 600;
    }
    .checkbox-round:checked {
      background-color: #1e3a24;
      border-color: #1e3a24;
    }
  </style>
</head>
<body class="min-h-screen pb-20">

  <!-- 頂部綠色深底 Header -->
  <header class="bg-[#1b3822] text-white sticky top-0 z-40 shadow-sm">
    <!-- 主列 -->
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2 cursor-pointer" onclick="switchView('catalog')">
        <span class="w-8 h-8 rounded-lg bg-[#274c31] flex items-center justify-center text-emerald-300 text-sm">
          <i class="fa-solid fa-campground"></i>
        </span>
        <h1 class="text-base sm:text-lg font-bold tracking-wide">露營裝備檢核與分工</h1>
      </div>
      
      <!-- 右上角快捷鍵 -->
      <div class="flex items-center gap-2">
        <button onclick="switchView('catalog')" class="bg-[#274c31] hover:bg-[#325e3d] text-white text-xs px-3 py-1.5 rounded-lg flex items-center gap-1.5 transition">
          <i class="fa-solid fa-table-cells-large"></i> 目錄
        </button>
        <button onclick="copyToLine()" class="bg-[#168a54] hover:bg-[#1caa67] text-white text-xs px-3 py-1.5 rounded-lg font-medium flex items-center gap-1.5 shadow transition">
          <i class="fa-solid fa-share-nodes"></i> 複製清單
        </button>
        <button onclick="resetChecks()" class="bg-[#274c31] hover:bg-[#325e3d] text-stone-200 text-xs p-1.5 w-8 h-8 rounded-lg flex items-center justify-center transition" title="重設勾選">
          <i class="fa-solid fa-rotate-left"></i>
        </button>
        <button onclick="restoreDefault()" class="bg-[#274c31] hover:bg-[#325e3d] text-stone-200 text-xs p-1.5 w-8 h-8 rounded-lg flex items-center justify-center transition" title="還原預設資料">
          <i class="fa-solid fa-arrows-rotate"></i>
        </button>
      </div>
    </div>

    <!-- 次層分類導覽列 (橫向 Tab 列) -->
    <div class="bg-[#142b1a] border-t border-[#23452c]">
      <div class="max-w-5xl mx-auto px-3 py-1.5 flex items-center gap-1.5 overflow-x-auto text-xs whitespace-nowrap scrollbar-none" id="headerTabs">
        <!-- JS 動態生成 -->
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 mt-4 space-y-3.5">

    <!-- 1. 營區資訊與導航卡片 -->
    <section class="bg-[#ffffff] rounded-2xl p-3.5 sm:p-4 border border-[#e9e5dc] shadow-sm">
      <div class="flex flex-col sm:flex-row gap-2.5">
        <div class="relative flex-1">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-emerald-800">
            <i class="fa-solid fa-location-dot"></i>
          </span>
          <input type="text" id="campLocation" oninput="saveCampInfo()" placeholder="輸入露營區名稱或詳細地址..." class="w-full pl-9 pr-3 py-2 text-sm bg-stone-50 border border-stone-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1b3822] text-stone-800 font-medium">
        </div>
        <button onclick="openNavigation()" class="bg-[#23452b] hover:bg-[#1b3822] text-white px-4 py-2 rounded-xl text-sm font-medium flex items-center justify-center gap-1.5 transition shrink-0 shadow-sm">
          <i class="fa-solid fa-diamond-turn-right text-xs"></i> Google 導航
        </button>
      </div>
      <div class="mt-2.5">
        <input type="text" id="campNotes" oninput="saveCampInfo()" placeholder="行程備註（例：週六 11:00 前抵達、草皮 A 區 3 帳。夜間溫差約 13 度請自備防風外套...）" class="w-full px-3.5 py-2 text-xs sm:text-sm bg-stone-50 border border-stone-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#1b3822] text-stone-700">
      </div>
    </section>

    <!-- 2. 進度條與誰買的 (負責人) 篩選卡片 -->
    <section class="bg-[#ffffff] rounded-2xl p-3.5 border border-[#e9e5dc] shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-3">
      <!-- 左：進度狀態 -->
      <div class="flex items-center gap-3 flex-1 min-w-[200px]">
        <div class="flex items-center gap-1.5 text-xs sm:text-sm font-semibold text-stone-700 shrink-0">
          <i class="fa-regular fa-circle-check text-emerald-700"></i>
          <span>整備進度 <b id="progressPercent" class="text-stone-900">0%</b></span>
        </div>
        <div class="flex-1 bg-stone-200 h-2 rounded-full overflow-hidden max-w-xs">
          <div id="progressBar" class="bg-[#1b3822] h-full transition-all duration-300" style="width: 0%"></div>
        </div>
        <span id="progressFraction" class="text-[11px] text-stone-400 font-mono shrink-0">0/0 齊全</span>
      </div>

      <!-- 右：誰買的快速篩選器 -->
      <div class="flex items-center gap-1.5 overflow-x-auto text-xs pb-0.5 sm:pb-0" id="assigneeFilterRow">
        <span class="text-stone-400 text-[11px] shrink-0 mr-1">誰買的:</span>
        <!-- 動態按鈕 -->
      </div>
    </section>

    <!-- 3. 【快速分區目錄看板】 (預設主視覺九宮格) -->
    <section id="catalogDashboardView">
      <div class="flex items-center justify-between mb-2.5 px-0.5">
        <h2 class="text-xs font-bold text-stone-600 flex items-center gap-1.5">
          <span>快速分區目錄</span>
        </h2>
        <button onclick="switchView('all')" class="text-xs text-stone-600 hover:text-emerald-800 font-medium flex items-center gap-1 transition">
          <i class="fa-solid fa-layer-group text-[11px]"></i> 展開全部分頁
        </button>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3" id="catalogCardsContainer">
        <!-- 動態渲染各大分區卡片 -->
      </div>
    </section>

    <!-- 4. 食材區專用菜單規劃卡 (這次煮什麼) -->
    <section id="menuCard" class="bg-[#fef9ee] rounded-2xl p-3.5 border border-[#fae2b6] shadow-sm hidden">
      <div class="flex items-center justify-between mb-2">
        <span class="text-sm font-bold text-amber-950 flex items-center gap-1.5">
          <i class="fa-solid fa-utensils text-amber-700"></i> 🍽️ 本次露營料理規劃 (這次煮什麼？)
        </span>
        <span class="text-xs text-amber-700/80">隨填即存</span>
      </div>
      <textarea id="menuPlanning" oninput="saveMenuPlan()" rows="2" placeholder="例：Day 1 晚餐：部隊鍋、炙燒牛排；Day 2 早餐：起司壓吐司、手沖咖啡..." class="w-full p-2.5 text-xs sm:text-sm bg-white border border-amber-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-700 text-stone-800"></textarea>
    </section>

    <!-- 5. 品項詳細清單區 (分頁或全部展開時顯示) -->
    <section id="categoryDetailView" class="space-y-3.5 hidden">
      <div class="flex items-center justify-between px-1">
        <button onclick="switchView('catalog')" class="text-xs text-emerald-900 hover:underline font-bold flex items-center gap-1">
          <i class="fa-solid fa-chevron-left"></i> 回到快速分區目錄
        </button>
        <span id="currentViewBadge" class="text-xs font-medium text-stone-500">全部品項</span>
      </div>
      <div id="categoryCardsContainer" class="space-y-3.5">
        <!-- 渲染細項卡片 -->
      </div>
    </section>

  </main>

  <script>
    const INITIAL_CATEGORIES = [
      {
        id: "camping",
        name: "露營用品",
        icon: "fa-campground",
        items: [
          { text: "帳篷 (外帳/內帳/地布)", checked: false, assignee: "公家" },
          { text: "營釘 / 營槌 / 拔釘器", checked: false, assignee: "公家" },
          { text: "天幕 / 營柱 / 營繩 / 調節片", checked: false, assignee: "阿保" },
          { text: "充氣床墊 / 打氣機 / 床包", checked: false, assignee: "個人自備" },
          { text: "睡袋 / 保暖毛毯 / 充氣枕頭", checked: false, assignee: "個人自備" },
          { text: "露營椅 / 折疊露營桌", checked: false, assignee: "個人自備" },
          { text: "露營美學燈 / 營燈 / 手電筒 / 充電線", checked: false, assignee: "小明" },
          { text: "動力線 / 延長線 (建議10-15米)", checked: false, assignee: "阿保" }
        ]
      },
      {
        id: "cooking",
        name: "煮飯野炊",
        icon: "fa-utensils",
        items: [
          { text: "卡式爐 / 擋風板 / 瓦斯罐 (備用2罐)", checked: false, assignee: "小明" },
          { text: "露營套鍋組 / 平底煎鍋", checked: false, assignee: "詠文" },
          { text: "砧板 / 料理刀 / 食物剪刀 / 夾子", checked: false, assignee: "詠文" },
          { text: "調味品組 (油、鹽、黑胡椒、醬油)", checked: false, assignee: "詠文" },
          { text: "保冰桶 / 保冷袋 / 保冰磚", checked: false, assignee: "公家" },
          { text: "餐具碗筷 / 杯子 (建議自備環保餐具)", checked: false, assignee: "個人自備" },
          { text: "耐熱洗碗精 / 菜瓜布 / 廚房紙巾", checked: false, assignee: "公家" },
          { text: "耐熱垃圾袋 (分類用)", checked: false, assignee: "公家" }
        ]
      },
      {
        id: "food",
        name: "食材採購",
        icon: "fa-basket-shopping",
        items: [
          { text: "主餐肉品 (牛排、火鍋肉片)", checked: false, assignee: "小明" },
          { text: "火鍋湯底包 / 綜合蔬菜盤", checked: false, assignee: "詠文" },
          { text: "早餐食材 (吐司、雞蛋、起司片)", checked: false, assignee: "阿保" },
          { text: "常溫飲用水 (大罐 6L 2桶)", checked: false, assignee: "公家" },
          { text: "水果 / 零食點心包", checked: false, assignee: "個人自備" }
        ]
      },
      {
        id: "drinks",
        name: "酒水軟飲",
        icon: "fa-beer-mug-empty",
        items: [
          { text: "啤酒 (1~2手冰鎮)", checked: false, assignee: "阿保" },
          { text: "調酒用烈酒 (威士忌/琴酒)", checked: false, assignee: "小明" },
          { text: "無糖綠茶 / 烏龍茶 (解膩)", checked: false, assignee: "詠文" },
          { text: "氣泡水 / 可樂 / 檸檬片", checked: false, assignee: "公家" },
          { text: "食用衛生冰塊 (大包裝兩包)", checked: false, assignee: "小明" },
          { text: "紅白酒 / 開瓶器", checked: false, assignee: "詠文" }
        ]
      },
      {
        id: "games",
        name: "休閒娛樂",
        icon: "fa-gamepad",
        items: [
          { text: "微型露營投影機 / 投影布幕", checked: false, assignee: "小明" },
          { text: "藍牙防水喇叭", checked: false, assignee: "阿保" },
          { text: "桌遊 (阿瓦隆/德國心臟病/撲克牌)", checked: false, assignee: "詠文" },
          { text: "羽毛球拍 / 飛盤", checked: false, assignee: "公家" },
          { text: "Switch 主機 + 雙手把", checked: false, assignee: "小明" }
        ]
      },
      {
        id: "personal",
        name: "個人物品",
        icon: "fa-user-large",
        items: [
          { text: "健保卡 / 身分證 / 現金", checked: false, assignee: "個人自備" },
          { text: "換洗衣物 / 洋蔥式保暖外套 / 毛帽", checked: false, assignee: "個人自備" },
          { text: "盥洗包 (牙刷、毛巾、沐浴品)", checked: false, assignee: "個人自備" },
          { text: "防蚊液 / 蚊蟲止癢膏 / 防曬乳", checked: false, assignee: "個人自備" },
          { text: "行動電源 / 各式充電線", checked: false, assignee: "個人自備" },
          { text: "個人隨身常備藥品 (止痛、胃腸藥)", checked: false, assignee: "個人自備" },
          { text: "拖鞋 / 輕便鞋", checked: false, assignee: "個人自備" }
        ]
      },
      {
        id: "notes",
        name: "自由備忘",
        icon: "fa-clipboard-list",
        items: [
          { text: "確認山上夜間溫度 (注意保暖)", checked: false, assignee: "公家" },
          { text: "出發前最後一家全聯完成生鮮採買", checked: false, assignee: "公家" }
        ]
      }
    ];

    let state = {
      categories: JSON.parse(localStorage.getItem('camping_cats_v3')) || INITIAL_CATEGORIES,
      currentView: 'catalog', // 'catalog' (預設九宮格目錄), 'all' (全展開), 或分類 id
      selectedAssignee: '全部',
      location: localStorage.getItem('camping_loc_v3') || '苗栗泰安森呼吸高山露營區',
      notes: localStorage.getItem('camping_notes_v3') || '週六 11:00 前抵達、草皮 A 區 3 帳。夜間溫差約 13 度請自備防風外套。',
      menuPlan: localStorage.getItem('camping_menu_v3') || '晚餐：炙燒蒜香牛排 + 麻油雞火鍋；早餐：熱壓起司火腿吐司 + 研磨手沖咖啡'
    };

    function saveState() {
      localStorage.setItem('camping_cats_v3', JSON.stringify(state.categories));
      updateUI();
    }

    function saveCampInfo() {
      state.location = document.getElementById('campLocation').value;
      state.notes = document.getElementById('campNotes').value;
      localStorage.setItem('camping_loc_v3', state.location);
      localStorage.setItem('camping_notes_v3', state.notes);
    }

    function saveMenuPlan() {
      state.menuPlan = document.getElementById('menuPlanning').value;
      localStorage.setItem('camping_menu_v3', state.menuPlan);
    }

    function openNavigation() {
      const loc = document.getElementById('campLocation').value.trim();
      if (!loc) {
        alert('請先輸入露營區名稱或地址！');
        return;
      }
      window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(loc)}`, '_blank');
    }

    function switchView(viewId) {
      state.currentView = viewId;
      updateUI();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function setAssignee(who) {
      state.selectedAssignee = who;
      renderAssigneeFilters();
      renderCategoryDetail();
    }

    // 渲染上方 Tab 列
    function renderHeaderTabs() {
      const container = document.getElementById('headerTabs');
      container.innerHTML = '';

      // 1. 目錄按鈕
      const catBtn = document.createElement('button');
      catBtn.className = `px-3 py-1 rounded-md font-medium transition flex items-center gap-1.5 ${state.currentView === 'catalog' ? 'nav-btn-active font-bold' : 'text-stone-300 hover:text-white hover:bg-[#1b3822]'}`;
      catBtn.innerHTML = `<i class="fa-solid fa-table-cells-large"></i> 目錄`;
      catBtn.onclick = () => switchView('catalog');
      container.appendChild(catBtn);

      // 2. 全展開按鈕
      const allBtn = document.createElement('button');
      allBtn.className = `px-3 py-1 rounded-md font-medium transition flex items-center gap-1.5 ${state.currentView === 'all' ? 'nav-btn-active font-bold' : 'text-stone-300 hover:text-white hover:bg-[#1b3822]'}`;
      allBtn.innerHTML = `<i class="fa-solid fa-layer-group"></i> 全展開`;
      allBtn.onclick = () => switchView('all');
      container.appendChild(allBtn);

      // 各分類 Tab
      state.categories.forEach(cat => {
        const total = cat.items.length;
        const done = cat.items.filter(i => i.checked).length;
        const btn = document.createElement('button');
        btn.className = `px-3 py-1 rounded-md font-medium transition flex items-center gap-1.5 ${state.currentView === cat.id ? 'nav-btn-active font-bold' : 'text-stone-300 hover:text-white hover:bg-[#1b3822]'}`;
        btn.innerHTML = `${cat.name} <span class="opacity-60 text-[10px]">(${done}/${total})</span>`;
        btn.onclick = () => switchView(cat.id);
        container.appendChild(btn);
      });
    }

    // 渲染誰買的篩選按鈕
    function renderAssigneeFilters() {
      const container = document.getElementById('assigneeFilterRow');
      container.innerHTML = '<span class="text-stone-400 text-[11px] shrink-0 mr-1">誰買的:</span>';

      const people = ['全部', '小明', '阿保', '詠文', '個人自備', '公家'];
      // 同步蒐集使用者自己新增的負責人
      state.categories.forEach(c => c.items.forEach(i => {
        if (i.assignee && !people.includes(i.assignee)) people.push(i.assignee);
      }));

      people.forEach(p => {
        const isActive = state.selectedAssignee === p;
        const btn = document.createElement('button');
        btn.className = `assignee-pill px-2.5 py-0.5 rounded-full text-xs font-medium shrink-0 transition ${isActive ? 'bg-[#1b3822] text-white shadow-sm' : 'bg-stone-100 text-stone-600 hover:bg-stone-200'}`;
        btn.textContent = p;
        btn.onclick = () => setAssignee(p);
        container.appendChild(btn);
      });
    }

    // 渲染【快速分區目錄看板】(九宮格卡片)
    function renderCatalogDashboard() {
      const dashboard = document.getElementById('catalogDashboardView');
      const container = document.getElementById('catalogCardsContainer');
      
      if (state.currentView !== 'catalog') {
        dashboard.classList.add('hidden');
        return;
      }
      dashboard.classList.remove('hidden');
      container.innerHTML = '';

      state.categories.forEach(cat => {
        const total = cat.items.length;
        const done = cat.items.filter(i => i.checked).length;
        const pct = total === 0 ? 0 : Math.round((done / total) * 100);

        const card = document.createElement('div');
        card.className = "custom-card p-4 cursor-pointer flex flex-col justify-between";
        card.onclick = () => switchView(cat.id);

        card.innerHTML = `
          <div>
            <div class="flex items-center justify-between mb-3">
              <div class="flex items-center gap-2.5">
                <span class="w-8 h-8 rounded-lg bg-stone-100 text-stone-700 flex items-center justify-center text-sm">
                  <i class="fa-solid ${cat.icon}"></i>
                </span>
                <h3 class="font-bold text-stone-800 text-sm sm:text-base">${cat.name}</h3>
              </div>
              <span class="text-xs text-stone-400 font-mono">${done}/${total}</span>
            </div>
            
            <div class="w-full bg-stone-100 h-1.5 rounded-full overflow-hidden mb-3">
              <div class="bg-[#1b3822] h-full" style="width: ${pct}%"></div>
            </div>
          </div>

          <div class="flex items-center justify-between text-xs text-stone-500 pt-1">
            <span class="font-semibold text-stone-600">${pct}%</span>
            <i class="fa-solid fa-angle-right text-stone-400"></i>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // 渲染【品項清單主體】
    function renderCategoryDetail() {
      const detailSection = document.getElementById('categoryDetailView');
      const cardsContainer = document.getElementById('categoryCardsContainer');
      const badge = document.getElementById('currentViewBadge');
      const menuCard = document.getElementById('menuCard');

      if (state.currentView === 'catalog') {
        detailSection.classList.add('hidden');
        menuCard.classList.add('hidden');
        return;
      }

      detailSection.classList.remove('hidden');
      cardsContainer.innerHTML = '';

      // 菜單卡只在「食材採購」或「全展開」顯示
      if (state.currentView === 'food' || state.currentView === 'all') {
        menuCard.classList.remove('hidden');
      } else {
        menuCard.classList.add('hidden');
      }

      if (state.currentView === 'all') {
        badge.textContent = `全部分類清單 (篩選：${state.selectedAssignee})`;
      } else {
        const curr = state.categories.find(c => c.id === state.currentView);
        badge.textContent = `${curr ? curr.name : ''} (篩選：${state.selectedAssignee})`;
      }

      state.categories.forEach((cat, catIdx) => {
        if (state.currentView !== 'all' && state.currentView !== cat.id) return;

        // 依誰買的篩選
        const filtered = cat.items.map((item, originalIndex) => ({ ...item, originalIndex }))
          .filter(item => state.selectedAssignee === '全部' || item.assignee === state.selectedAssignee);

        const card = document.createElement('div');
        card.className = "bg-white rounded-2xl p-4 border border-[#e9e5dc] shadow-sm";

        const doneCount = cat.items.filter(i => i.checked).length;
        const totalCount = cat.items.length;
        const pct = totalCount === 0 ? 0 : Math.round((doneCount / totalCount) * 100);

        card.innerHTML = `
          <div class="flex items-center justify-between pb-3 border-b border-stone-100 mb-3">
            <div class="flex items-center gap-2">
              <span class="w-7 h-7 rounded-lg bg-stone-100 text-stone-700 flex items-center justify-center text-xs">
                <i class="fa-solid ${cat.icon}"></i>
              </span>
              <h3 class="font-bold text-stone-800 text-sm sm:text-base">${cat.name}</h3>
              <span class="text-xs text-stone-400 font-mono">(${doneCount}/${totalCount})</span>
            </div>
            <span class="text-xs font-semibold ${pct === 100 ? 'text-emerald-700' : 'text-stone-400'}">${pct}%</span>
          </div>

          <!-- 項目清單 -->
          <div class="space-y-1.5" id="list-${cat.id}">
            ${filtered.length === 0 ? '<p class="text-xs text-stone-400 py-3 text-center">此負責人無指派項目</p>' : ''}
          </div>

          <!-- 底部新增品項列 -->
          <div class="mt-3.5 pt-2.5 border-t border-dashed border-stone-200 flex gap-2">
            <input type="text" id="add-text-${catIdx}" placeholder="新增項目..." class="flex-1 px-3 py-1.5 text-xs sm:text-sm bg-stone-50 border border-stone-300 rounded-xl focus:outline-none focus:ring-1 focus:ring-[#1b3822]">
            <input type="text" id="add-who-${catIdx}" placeholder="誰買/誰帶" class="w-20 sm:w-24 px-2 py-1.5 text-xs sm:text-sm bg-stone-50 border border-stone-300 rounded-xl focus:outline-none focus:ring-1 focus:ring-[#1b3822] text-center">
            <button onclick="addItem(${catIdx})" class="bg-[#1b3822] hover:bg-[#274c31] text-white px-3 py-1.5 rounded-xl text-xs font-medium shrink-0 transition">
              <i class="fa-solid fa-plus"></i> 新增
            </button>
          </div>
        `;

        const listContainer = card.querySelector(`#list-${cat.id}`);
        filtered.forEach(item => {
          const row = document.createElement('div');
          row.className = "group flex items-center justify-between p-2 rounded-xl hover:bg-stone-50 transition border border-transparent hover:border-stone-200";
          row.innerHTML = `
            <label class="flex items-center gap-2.5 flex-1 cursor-pointer select-none">
              <input type="checkbox" ${item.checked ? 'checked' : ''} onchange="toggleItem(${catIdx}, ${item.originalIndex})" class="checkbox-round w-4 h-4 rounded text-emerald-800 border-stone-300 focus:ring-0">
              <span class="text-xs sm:text-sm ${item.checked ? 'line-through text-stone-400' : 'text-stone-700'}">${item.text}</span>
            </label>
            <div class="flex items-center gap-1.5">
              <button onclick="editAssignee(${catIdx}, ${item.originalIndex})" class="text-[11px] px-2 py-0.5 rounded-full bg-stone-100 hover:bg-emerald-50 text-stone-600 hover:text-emerald-800 border border-stone-200 transition" title="點擊修改負責人">
                <i class="fa-solid fa-user text-[9px] mr-1 opacity-60"></i>${item.assignee || '未指派'}
              </button>
              <button onclick="deleteItem(${catIdx}, ${item.originalIndex})" class="opacity-0 group-hover:opacity-100 text-stone-300 hover:text-red-500 p-1 text-xs transition" title="刪除">
                <i class="fa-regular fa-trash-can"></i>
              </button>
            </div>
          `;
          listContainer.appendChild(row);
        });

        cardsContainer.appendChild(card);
      });
    }

    // 計算總進度
    function updateProgress() {
      let total = 0;
      let checked = 0;
      state.categories.forEach(c => {
        total += c.items.length;
        checked += c.items.filter(i => i.checked).length;
      });
      const pct = total === 0 ? 0 : Math.round((checked / total) * 100);
      document.getElementById('progressBar').style.width = pct + '%';
      document.getElementById('progressPercent').textContent = pct + '%';
      document.getElementById('progressFraction').textContent = `${checked}/${total} 齊全`;
    }

    function toggleItem(catIdx, itemIdx) {
      state.categories[catIdx].items[itemIdx].checked = !state.categories[catIdx].items[itemIdx].checked;
      saveState();
    }

    function deleteItem(catIdx, itemIdx) {
      state.categories[catIdx].items.splice(itemIdx, 1);
      saveState();
    }

    function addItem(catIdx) {
      const textEl = document.getElementById(`add-text-${catIdx}`);
      const whoEl = document.getElementById(`add-who-${catIdx}`);
      const text = textEl.value.trim();
      const who = whoEl.value.trim() || '公家';

      if (!text) return;

      state.categories[catIdx].items.push({ text: text, checked: false, assignee: who });
      textEl.value = '';
      whoEl.value = '';
      saveState();
    }

    function editAssignee(catIdx, itemIdx) {
      const curr = state.categories[catIdx].items[itemIdx].assignee || '';
      const val = prompt('修改此品項的負責人 / 誰買：', curr);
      if (val !== null) {
        state.categories[catIdx].items[itemIdx].assignee = val.trim() || '公家';
        saveState();
      }
    }

    function resetChecks() {
      if (confirm('確定要將所有項目的勾選狀態重置為「未完成」嗎？')) {
        state.categories.forEach(c => c.items.forEach(i => i.checked = false));
        saveState();
      }
    }

    function restoreDefault() {
      if (confirm('確定要還原成初始預設的範例清單與營區資料嗎？')) {
        localStorage.clear();
        state.categories = JSON.parse(JSON.stringify(INITIAL_CATEGORIES));
        state.currentView = 'catalog';
        state.selectedAssignee = '全部';
        state.location = '苗栗泰安森呼吸高山露營區';
        state.notes = '週六 11:00 前抵達、草皮 A 區 3 帳。夜間溫差約 13 度請自備防風外套。';
        state.menuPlan = '晚餐：炙燒蒜香牛排 + 麻油雞火鍋；早餐：熱壓起司火腿吐司 + 研磨手沖咖啡';
        document.getElementById('campLocation').value = state.location;
        document.getElementById('campNotes').value = state.notes;
        document.getElementById('menuPlanning').value = state.menuPlan;
        saveState();
      }
    }

    function copyToLine() {
      let text = `⛺ 【露營裝備檢核與分工清單】\n`;
      if (state.location) text += `📍 營區位置：${state.location}\n`;
      if (state.notes) text += `📝 行程備註：${state.notes}\n`;
      if (state.location) text += `🗺️ Google 導航：https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(state.location)}\n`;

      if (state.menuPlan) {
        text += `\n🍽️ 【料理規劃 (煮什麼)】\n${state.menuPlan}\n`;
      }

      text += `\n=========================\n`;

      state.categories.forEach(cat => {
        text += `\n【${cat.name}】\n`;
        cat.items.forEach(i => {
          const mark = i.checked ? '✅' : '⬜';
          const who = i.assignee ? ` [${i.assignee}]` : '';
          text += `${mark} ${i.text}${who}\n`;
        });
      });

      navigator.clipboard.writeText(text).then(() => {
        alert('已複製完整露營清單！可直接貼上至 LINE 群組 ⛺');
      }).catch(() => {
        alert('複製失敗，請手動複製');
      });
    }

    function updateUI() {
      renderHeaderTabs();
      renderAssigneeFilters();
      renderCatalogDashboard();
      renderCategoryDetail();
      updateProgress();
    }

    // 初始化載入
    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('campLocation').value = state.location;
      document.getElementById('campNotes').value = state.notes;
      document.getElementById('menuPlanning').value = state.menuPlan;
      updateUI();
    });
  </script>
</body>
</html>
